name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time. `cancel-in-progress: false` is deliberate: cancelling a
# run mid-way could abort it between the migration step and the container
# restart, which is the one window where the schema and the running code
# disagree.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  NODE_VERSION: '22'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # The deploy target does not exist yet. There is no VPS, and the `production`
  # environment holds none of the four secrets the deploy job needs, so every
  # push to main failed at `ssh-keyscan -H ""` with a bare `exit code 1` — a
  # message that reads like a broken SSH key rather than absent configuration.
  #
  # This gate makes the pre-infrastructure state explicit instead of noisy. A
  # Deploy that is red on every commit trains everyone to ignore the one
  # workflow that touches production, which is exactly the signal worth
  # keeping.
  #
  # `DEPLOY_ENABLED` is a repository variable, deliberately separate from the
  # secrets: setting it is the one-time act of declaring "production exists".
  # Before it is set, a missing secret is the expected state and the deploy
  # skips quietly. After it is set, a missing secret is a real fault and this
  # job FAILS LOUDLY rather than skipping — because once there is a production
  # box, a silently skipped deploy is worse than a failed one.
  #
  # Gating on a variable rather than on secret presence is what buys that
  # distinction. `secrets` is not available in a job-level `if:` anyway (only
  # `github`, `needs`, `vars` and `inputs` are), so the check has to run inside
  # a step regardless.
  preflight:
    name: Check the deploy target is provisioned
    runs-on: ubuntu-latest
    environment: production
    outputs:
      ready: ${{ steps.gate.outputs.ready }}
    steps:
      - id: gate
        env:
          DEPLOY_ENABLED: ${{ vars.DEPLOY_ENABLED }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          APP_HOST: ${{ secrets.APP_HOST }}
        run: |
          if [ "$DEPLOY_ENABLED" != "true" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy skipped::No deploy target is provisioned. Set the repository variable DEPLOY_ENABLED=true once the VPS exists and the production environment holds VPS_HOST, VPS_USER, VPS_SSH_KEY and APP_HOST."
            exit 0
          fi

          missing=""
          [ -n "$VPS_HOST" ]    || missing="$missing VPS_HOST"
          [ -n "$VPS_USER" ]    || missing="$missing VPS_USER"
          [ -n "$VPS_SSH_KEY" ] || missing="$missing VPS_SSH_KEY"
          [ -n "$APP_HOST" ]    || missing="$missing APP_HOST"

          if [ -n "$missing" ]; then
            echo "::error title=Deploy secrets missing::DEPLOY_ENABLED is true, so a deploy was expected, but these secrets are empty or unset in the production environment:$missing"
            exit 1
          fi

          echo "ready=true" >> "$GITHUB_OUTPUT"

  build-image:
    name: Build and push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.sha }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        # DV-26: images are tagged with the commit SHA, so a rollback is
        # redeploying a previous SHA. That only works because migrations are
        # forward-only (AR-23) and expand/contract (DV-27) — the old image must
        # still run against the new schema.
        run: echo "sha=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # AR-58: images are built in CI, never on the VPS. This is what keeps a
      # 2-vCPU box viable — it only pulls and runs.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Migrate and release
    # `build-image` deliberately stays ungated and keeps running on every push:
    # it is the only thing that proves the Dockerfile still builds, and that
    # signal is worth having long before there is anywhere to deploy it to.
    needs: [preflight, build-image]
    if: needs.preflight.outputs.ready == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Install SSH key
        # DV-28: deploy secrets live in GitHub Actions secrets. Runtime secrets
        # live in the VPS `.env` and never pass through CI.
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Pull the new image
        run: |
          ssh -i ~/.ssh/id_ed25519 "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "cd /srv/allmywallet && IMAGE_TAG=${{ needs.build-image.outputs.image_tag }} docker compose pull web worker"

      # DV-25: migrations run as a separate, GATED step BEFORE containers
      # restart. A failed migration aborts the deploy here and leaves the
      # running version untouched — which is the whole reason this is its own
      # step rather than a container entrypoint. There is no staging (AR-67),
      # so this gate is the only thing between a bad migration and production.
      - name: Run migrations (gated — deploy aborts if this fails)
        run: |
          ssh -i ~/.ssh/id_ed25519 "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "cd /srv/allmywallet && IMAGE_TAG=${{ needs.build-image.outputs.image_tag }} \
             docker compose run --rm --no-deps web node_modules/.bin/tsx src/db/migrate.ts"

      - name: Restart web and worker
        run: |
          ssh -i ~/.ssh/id_ed25519 "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "cd /srv/allmywallet && IMAGE_TAG=${{ needs.build-image.outputs.image_tag }} docker compose up -d web worker"

      # AR-50: /api/health reports database reachability, worker liveness and
      # last successful quote sync. A deploy that starts but cannot serve is a
      # failed deploy, so the health check decides, not `docker compose up`'s
      # exit code.
      - name: Health check
        id: health
        run: |
          for attempt in $(seq 1 10); do
            if curl -fsS --max-time 10 "https://${{ secrets.APP_HOST }}/api/health" > /tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi
            echo "health check attempt $attempt failed; retrying in 6s"
            sleep 6
          done
          echo "health check never succeeded"
          exit 1

      - name: Roll back to the previous image
        if: failure() && steps.health.outcome == 'failure'
        # DV-26: rollback is redeploying a previous SHA. The schema is left
        # alone — forward-only migrations mean the previous image must still
        # run against the migrated schema, which is exactly what DV-27's
        # expand/contract discipline buys.
        #
        # This previously read `docker compose rollback.sh || (…fallback…)`.
        # `rollback.sh` is not a Compose subcommand and no such script exists,
        # so the first clause could only ever error and the `||` fallback was
        # what actually ran — every time. It was never noticed because this
        # step has never executed: the job has failed at its first step on
        # every run since the pipeline landed. The dead clause is removed
        # rather than repaired, since the fallback *is* the rollback.
        run: |
          ssh -i ~/.ssh/id_ed25519 "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "cd /srv/allmywallet && \
             if [ ! -s .last-good-tag ]; then \
               echo 'no .last-good-tag on the box — nothing to roll back to' >&2; exit 1; \
             fi && \
             IMAGE_TAG=\$(cat .last-good-tag) docker compose up -d web worker"
          echo "::error::Deploy failed its health check and was rolled back. Schema was NOT reverted (AR-23: forward-only)."
          exit 1

      - name: Record this image as last-known-good
        run: |
          ssh -i ~/.ssh/id_ed25519 "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "cd /srv/allmywallet && echo ${{ needs.build-image.outputs.image_tag }} > .last-good-tag"
