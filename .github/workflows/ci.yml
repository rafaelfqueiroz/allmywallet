name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# ---------------------------------------------------------------------------
# WHAT RUNS WHERE, AND WHY IT IS NOT THE SAME
#
# A pull request runs everything. A push to `main` runs only `static`, `unit`
# and `audit`.
#
# The full gate costs 20 billable minutes across eight parallel jobs, and it ran
# once already on the PR whose merge produced this commit. Re-running all of it
# on `main` was costing that again per merge against a 2.000-minute monthly tier
# the project has come within 300 minutes of (DEVELOPMENT §8).
#
# **What running on `main` is actually for** is the one thing a PR cannot check:
# two branches, each green against an older `main`, merged in sequence — the
# second was never tested against the first. The dominant form of that is a
# symbol one branch renamed and the other still calls, which `static` catches by
# typechecking, and `unit` catches where the contract rather than the signature
# moved. Those two are kept for exactly that reason.
#
# **What is dropped, and the honest cost.** `integration`, `isolation`, `e2e`
# and `visual` would catch a *runtime* conflict between two merges that
# typechecks cleanly. That is a real gap, accepted deliberately: it needs two
# PRs in flight at once, this is a single-developer project merging in sequence,
# and the four suites are 11 of the 20 minutes. `build` is dropped for a
# stronger reason — `deploy.yml`'s `build-image` runs `pnpm build` inside the
# Dockerfile on this same push, so on `main` it was duplicated work rather than
# reduced coverage.
#
# If concurrent merges ever become normal here, this is the first thing to undo.
# ---------------------------------------------------------------------------

env:
  NODE_VERSION: '22'

# `pg_isready` needs `-d allmywallet` as well as `-U`. Without it, it connects
# to a database named after the user — `allmywallet_migrator`, which does not
# exist — so Postgres logs `FATAL: database "allmywallet_migrator" does not
# exist` every 10 seconds for the life of every job. The check still passes
# (the server answered, which is all `pg_isready` asks), so the only cost is
# the log: a six-hour E2E hang came back as 2,718 lines that were mostly this,
# with the one real line — apt failing to reach the Ubuntu mirrors — buried in
# it. The flag is the difference between a readable failure and a haystack.

jobs:
  # Fast gates first: a formatting failure should not wait on Testcontainers.
  static:
    name: Typecheck · lint · format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # AR-05: the import-boundary rules are in here. This is what keeps core/
      # free of the framework rather than discipline doing it.
      - run: pnpm lint
      - run: pnpm format:check

  unit:
    name: Unit tests · coverage
    runs-on: ubuntu-latest
    # Coverage is measured across unit, integration and isolation together, so
    # this job needs a database like the others. See the note on the run step.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: allmywallet_migrator
          POSTGRES_PASSWORD: allmywallet
          POSTGRES_DB: allmywallet
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U allmywallet_migrator -d allmywallet"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_MIGRATION_URL: postgresql://allmywallet_migrator:allmywallet@localhost:5432/allmywallet
      DATABASE_URL: postgresql://allmywallet_app:allmywallet@localhost:5432/allmywallet
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      # TS-28: 100% branch on the calculation engine, 80% everywhere else.
      # Thresholds live in vitest.config.ts so a local run gates identically.
      #
      # Measured across all three suites, not unit alone. TS-30 says adapters
      # are covered by integration tests exercising real behaviour rather than
      # by chasing unit coverage on framework calls — but a unit-only
      # measurement counts those files as zero, so following TS-30 correctly
      # would have dragged the global figure under its own 80% floor. The two
      # rules only agree if coverage sees the tests that actually exercise the
      # code.
      - run: pnpm test:coverage

  integration:
    name: Integration · migrations
    runs-on: ubuntu-latest
    # Pull requests only — see "What runs where" above.
    if: github.event_name == 'pull_request'
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: allmywallet_migrator
          POSTGRES_PASSWORD: allmywallet
          POSTGRES_DB: allmywallet
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U allmywallet_migrator -d allmywallet"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_MIGRATION_URL: postgresql://allmywallet_migrator:allmywallet@localhost:5432/allmywallet
      DATABASE_URL: postgresql://allmywallet_app:allmywallet@localhost:5432/allmywallet
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # A migration that does not apply to an empty database is a broken deploy,
      # and with no staging environment (AR-67) this is the only place it is caught.
      - name: Migrations apply cleanly to an empty database
        run: pnpm db:migrate
      - run: pnpm test:integration

  isolation:
    name: Tenant isolation (blocking)
    runs-on: ubuntu-latest
    # Pull requests only — see "What runs where" above.
    if: github.event_name == 'pull_request'
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: allmywallet_migrator
          POSTGRES_PASSWORD: allmywallet
          POSTGRES_DB: allmywallet
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U allmywallet_migrator -d allmywallet"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_MIGRATION_URL: postgresql://allmywallet_migrator:allmywallet@localhost:5432/allmywallet
      DATABASE_URL: postgresql://allmywallet_app:allmywallet@localhost:5432/allmywallet
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      # SPEC-003 BR-003-04 / TS-13. This gate stays blocking regardless of suite
      # time: the cost of the alternative is a stranger reading someone's
      # complete financial position. The enumeration test fails on any
      # tenant-scoped table lacking a policy or a test — never a maintained list.
      - run: pnpm test:isolation

  e2e:
    name: E2E journeys (blocking)
    runs-on: ubuntu-latest
    # Pull requests only — see "What runs where" above.
    if: github.event_name == 'pull_request'
    # DL-27: this gate was listed as blocking in DEVELOPMENT.md and in #33's
    # test plan long before it existed. `tests/e2e/` and this job are what make
    # the claim true.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: allmywallet_migrator
          POSTGRES_PASSWORD: allmywallet
          POSTGRES_DB: allmywallet
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U allmywallet_migrator -d allmywallet"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_MIGRATION_URL: postgresql://allmywallet_migrator:allmywallet@localhost:5432/allmywallet
      DATABASE_URL: postgresql://allmywallet_app:allmywallet@localhost:5432/allmywallet
      # SPEC-001: the build and the running server need syntactically valid
      # auth values, never real ones — no OAuth flow runs in this suite.
      AUTH_SECRET: ci-e2e-placeholder-secret-not-real-000000000
      AUTH_GOOGLE_ID: ci-e2e-placeholder-google-client-id
      AUTH_GOOGLE_SECRET: ci-e2e-placeholder-google-client-secret
      # Without this Auth.js rejects localhost as an untrusted host and every
      # session read throws instead of returning "signed out" — the suite would
      # then be asserting against an error path rather than the real one.
      # #42: this is now also what satisfies src/lib/trusted-host.ts's startup
      # assertion, which the standalone server runs with NODE_ENV=production.
      # `session.spec.ts` asserts the session endpoint actually answers, so a
      # regression here fails a test rather than only a server log.
      AUTH_TRUST_HOST: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      # 0000_roles.sql creates allmywallet_app without a password on purpose.
      # The Vitest suites set one via tests/support/postgres.ts; a job that
      # boots the real server has no such hook, and every connection fails with
      # 28P01 at startup.
      - run: pnpm db:provision-app-role
      - name: Install the browser Playwright is pinned to
        run: pnpm exec playwright install --with-deps chromium
      # Runs on desktop and on a phone viewport — DL-12 makes mobile
      # first-class, and the navigation is a different component there.
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  visual:
    name: Visual baselines (blocking)
    runs-on: ubuntu-latest
    # Pull requests only — see "What runs where" above.
    if: github.event_name == 'pull_request'
    # DL-C2: baselines are recorded in the pinned Playwright image and verified
    # in the same one. This job runs the container's browser directly — the
    # image the `test:visual:docker` script pulls locally is this same
    # `container:`, so a baseline recorded on a laptop matches here.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: allmywallet_migrator
          POSTGRES_PASSWORD: allmywallet
          POSTGRES_DB: allmywallet
        options: >-
          --health-cmd "pg_isready -U allmywallet_migrator -d allmywallet"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      # Inside a job container, services are reachable by name rather than on
      # localhost.
      DATABASE_MIGRATION_URL: postgresql://allmywallet_migrator:allmywallet@postgres:5432/allmywallet
      DATABASE_URL: postgresql://allmywallet_app:allmywallet@postgres:5432/allmywallet
      AUTH_SECRET: ci-visual-placeholder-secret-not-real-0000000
      AUTH_GOOGLE_ID: ci-visual-placeholder-google-client-id
      AUTH_GOOGLE_SECRET: ci-visual-placeholder-google-client-secret
      AUTH_TRUST_HOST: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm db:provision-app-role
      - run: pnpm test:visual
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-diff
          path: test-results/
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    # Pull requests only — see "What runs where" above.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # SPEC-001: src/auth.ts's requireAuthEnv() fails startup (AR-40/AR-41)
      # if these are absent, and `next build` executes route module code
      # while collecting page data for /signin — so the build needs
      # syntactically valid values even though it never signs anyone in.
      # Dummy, not secret: no real OAuth flow ever runs in this job.
      - run: pnpm build
        env:
          DATABASE_URL: postgresql://allmywallet_app:allmywallet@localhost:5432/allmywallet
          AUTH_SECRET: ci-build-placeholder-secret-not-real-0000000
          AUTH_GOOGLE_ID: ci-build-placeholder-google-client-id
          AUTH_GOOGLE_SECRET: ci-build-placeholder-google-client-secret
          # #42: `next build` sets NODE_ENV=production, so the host-trust
          # assertion (src/lib/trusted-host.ts) applies here too. A build has
          # no canonical origin to pin, so header trust is the honest answer —
          # the same reasoning, and the same value, as the Dockerfile's
          # builder stage.
          AUTH_TRUST_HOST: 'true'

  audit:
    name: Dependency vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # SPEC-003 progress log: dependency vulnerability scanning in CI.
      - run: pnpm audit --audit-level high
